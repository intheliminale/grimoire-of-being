<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wheel of the Year — In The Liminale</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --void:#080610;--deep:#120e22;--plum:#1e1630;--violet:#2e2048;
    --vlt:#4a3468;--lav:#9878c0;--mist:#d0c4e8;--ivory:#ede8dc;
    --amber:#c88a28;--gold:#e0a830;--gold-lt:#f8cc60;
    --burg:#6a1e2e;--rose:#c04060;--shadow:rgba(8,6,16,0.7);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--mist);font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;line-height:1.7;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}

  header{text-align:center;padding:4rem 2rem 2rem;position:relative;z-index:1}
  header::after{content:'';display:block;width:220px;height:1px;background:linear-gradient(to right,transparent,var(--amber),transparent);margin:1.5rem auto 0}
  .eyebrow{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.55em;text-transform:uppercase;color:var(--amber);margin-bottom:.8rem;opacity:.8}
  h1{font-family:'Cinzel',serif;font-size:clamp(2rem,5vw,3rem);font-weight:400;color:var(--ivory);letter-spacing:.07em}
  h1 em{display:block;font-family:'IM Fell English',serif;font-style:italic;font-size:.38em;color:var(--lav);margin-top:.4rem;letter-spacing:.06em;opacity:.85}

  main{max-width:960px;margin:0 auto;padding:2rem 2rem 8rem;position:relative;z-index:1}
  .section-label{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.48em;text-transform:uppercase;color:var(--amber);opacity:.8;margin-bottom:.4rem;text-align:center}
  .rule{width:100%;height:1px;background:linear-gradient(to right,transparent,var(--vlt),transparent);margin:.4rem 0 2rem}

  /* WHEEL */
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:1rem}
  #wheel-svg{width:100%;max-width:420px;height:auto}
  .wheel-seg{cursor:pointer;transition:opacity .15s ease}
  .wheel-seg:hover{opacity:.75}
  .wheel-glyph{font-family:'Cinzel',serif;fill:var(--gold-lt);font-size:20px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .wheel-label{font-family:'Cinzel',serif;fill:var(--mist);font-size:9px;letter-spacing:1px;text-anchor:middle;pointer-events:none;text-transform:uppercase}
  .wheel-center-text{font-family:'Cinzel',serif;fill:var(--ivory);text-anchor:middle}
  .wheel-marker{fill:var(--rose);filter:drop-shadow(0 0 6px rgba(192,64,96,0.8))}
  .today-caption{font-family:'IM Fell English',serif;font-style:italic;color:var(--lav);text-align:center;font-size:15px;margin-top:.6rem}
  .today-caption b{color:var(--gold-lt);font-style:normal;font-family:'Cinzel',serif;font-weight:400;letter-spacing:.03em}

  /* SABBAT NAV STRIP */
  .sabbat-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin:2.5rem 0 3rem}
  .sabbat-chip{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);background:var(--deep);border:1px solid #4a346855;border-radius:20px;padding:.5rem 1rem;text-decoration:none;transition:border-color .15s ease,color .15s ease}
  .sabbat-chip:hover,.sabbat-chip.active-chip{border-color:var(--gold);color:var(--gold-lt)}

  /* SABBAT CARDS */
  .sabbat-card{background:var(--deep);border:1px solid #c88a2833;border-radius:14px;margin-bottom:1.5rem;overflow:hidden;scroll-margin-top:20px}
  .sabbat-head{padding:2rem 2rem 1.2rem;text-align:center;position:relative}
  .sabbat-head::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,138,40,0.1), transparent 70%);pointer-events:none}
  .sabbat-glyph-big{font-size:2.4rem;color:var(--gold);margin-bottom:.3rem;position:relative}
  .sabbat-date{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--amber);opacity:.8;position:relative}
  .sabbat-name{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:400;color:var(--ivory);letter-spacing:.05em;margin:.3rem 0;position:relative}
  .sabbat-subtitle{font-family:'IM Fell English',serif;font-style:italic;color:var(--lav);font-size:1rem;position:relative}

  .tabs{display:flex;flex-wrap:wrap;border-top:1px solid #4a346840;border-bottom:1px solid #4a346840}
  .tab-btn{flex:1 1 auto;min-width:110px;background:none;border:none;color:var(--lav);font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;padding:.9rem .5rem;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease}
  .tab-btn.active{color:var(--gold-lt);border-bottom-color:var(--gold)}
  .tab-panel{display:none;padding:1.8rem 2rem 2.2rem}
  .tab-panel.active{display:block}
  .tab-panel p{margin-bottom:.9rem}
  .tab-panel p:last-child{margin-bottom:0}
  .tab-panel .em{color:var(--gold-lt);font-style:italic}

  .corr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem}
  .corr-item{background:var(--plum);border-radius:10px;padding:.9rem 1rem}
  .corr-label{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);margin-bottom:.3rem}
  .corr-value{font-size:.95rem;color:var(--ivory)}

  .culture-grid{display:grid;grid-template-columns:1fr;gap:1rem}
  .culture-item{border-left:2px solid var(--vlt);padding-left:1rem}
  .culture-item .c-name{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:.25rem}

  @media(min-width:640px){ .culture-grid{grid-template-columns:1fr 1fr} }
</style>
</head>

/* ===================== WHEEL RENDER ===================== */
const svgNS = "http://www.w3.org/2000/svg";
const CX = 200, CY = 200, R_OUTER = 185, R_INNER = 130, R_GLYPH = 158, R_LABEL = 178;

function polar(cx, cy, r, angleRad){
  return { x: cx + r*Math.cos(angleRad), y: cy + r*Math.sin(angleRad) };
}

function renderWheel(){
  const segGroup = document.getElementById('wheel-segments');
  SABBATS.forEach((s, i) => {
    const startA = (-90 + i*45 - 22.5) * (Math.PI/180);
    const endA = (-90 + i*45 + 22.5) * (Math.PI/180);
    const p1 = polar(CX,CY,R_OUTER,startA);
    const p2 = polar(CX,CY,R_OUTER,endA);
    const p3 = polar(CX,CY,R_INNER,endA);
    const p4 = polar(CX,CY,R_INNER,startA);
    const path = document.createElementNS(svgNS,'path');
    const d = `M ${p1.x} ${p1.y} A ${R_OUTER} ${R_OUTER} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${R_INNER} ${R_INNER} 0 0 0 ${p4.x} ${p4.y} Z`;
    path.setAttribute('d', d);
    path.setAttribute('fill', i % 2 === 0 ? '#1e163044' : '#2e204833');
    path.setAttribute('stroke', '#4a346840');
    path.setAttribute('stroke-width', '1');
    path.setAttribute('class', 'wheel-seg');
    path.setAttribute('data-id', s.id);
    path.addEventListener('click', () => selectSabbat(s.id, true));
    segGroup.appendChild(path);

    const glyphPos = polar(CX,CY,R_GLYPH,(-90+i*45)*(Math.PI/180));
    const glyphText = document.createElementNS(svgNS,'text');
    glyphText.setAttribute('x', glyphPos.x);
    glyphText.setAttribute('y', glyphPos.y - 6);
    glyphText.setAttribute('class','wheel-glyph');
    glyphText.textContent = s.glyph;
    segGroup.appendChild(glyphText);

    const labelPos = polar(CX,CY,R_LABEL,(-90+i*45)*(Math.PI/180));
    const labelText = document.createElementNS(svgNS,'text');
    labelText.setAttribute('x', labelPos.x);
    labelText.setAttribute('y', labelPos.y + 18);
    labelText.setAttribute('class','wheel-label');
    labelText.textContent = s.name;
    segGroup.appendChild(labelText);
  });
}

function dayOfYear(month, day, year){
  return Math.floor((Date.UTC(year, month-1, day) - Date.UTC(year,0,1)) / 86400000);
}

function renderMarker(){
  const now = new Date();
  const year = now.getFullYear();
  const todayDOY = dayOfYear(now.getMonth()+1, now.getDate(), year);

  const points = SABBATS.map((s,i) => ({
    idx:i, s, doy: dayOfYear(s.angleDay[0], s.angleDay[1], year)
  })).sort((a,b) => a.doy - b.doy);

  let prev = points[points.length-1], next = points[0];
  let prevDoy = prev.doy - 365, nextDoy = next.doy;
  for(let i=0;i<points.length;i++){
    if(points[i].doy <= todayDOY){ prev = points[i]; prevDoy = points[i].doy; }
    if(points[i].doy > todayDOY){ next = points[i]; nextDoy = points[i].doy; break; }
  }
  if(prevDoy > todayDOY) prevDoy -= 365;

  const span = nextDoy - prevDoy;
  const progress = span > 0 ? (todayDOY - prevDoy) / span : 0;

  const prevAngleDeg = -90 + prev.idx*45;
  let nextAngleDeg = -90 + next.idx*45;
  if(next.idx < prev.idx) nextAngleDeg += 360;
  const markerAngleDeg = prevAngleDeg + (nextAngleDeg - prevAngleDeg) * progress;
  const markerRad = markerAngleDeg * (Math.PI/180);
  const pos = polar(CX,CY,(R_OUTER+R_INNER)/2, markerRad);

  const markerGroup = document.getElementById('wheel-marker');
  markerGroup.innerHTML = '';
  const dot = document.createElementNS(svgNS,'circle');
  dot.setAttribute('cx', pos.x);
  dot.setAttribute('cy', pos.y);
  dot.setAttribute('r', 7);
  dot.setAttribute('class', 'wheel-marker');
  markerGroup.appendChild(dot);

  const daysToNext = Math.round(span - (todayDOY - prevDoy));
  const daysSincePrev = Math.round(todayDOY - prevDoy);
  document.getElementById('todayCaption').innerHTML =
    `<b>${daysSincePrev} day${daysSincePrev===1?'':'s'}</b> past ${prev.s.name} · <b>${daysToNext} day${daysToNext===1?'':'s'}</b> until ${next.s.name}`;
}

/* ===================== CARDS ===================== */
function renderStrip(){
  const strip = document.getElementById('sabbatStrip');
  SABBATS.forEach(s => {
    const a = document.createElement('a');
    a.href = '#' + s.id;
    a.className = 'sabbat-chip';
    a.id = 'chip-' + s.id;
    a.textContent = s.glyph + ' ' + s.name;
    a.addEventListener('click', (e) => { e.preventDefault(); selectSabbat(s.id, true); });
    strip.appendChild(a);
  });
}

const TABS = [
  {key:'meaning', label:'Meaning'},
  {key:'ritual', label:'Ritual'},
  {key:'chartResonance', label:'Chart Resonance'},
  {key:'correspondences', label:'Correspondences'},
  {key:'culture', label:'Cultural Parallels'}
];

function renderCards(){
  const container = document.getElementById('sabbatCards');
  SABBATS.forEach(s => {
    const card = document.createElement('div');
    card.className = 'sabbat-card';
    card.id = s.id;

    const head = document.createElement('div');
    head.className = 'sabbat-head';
    head.innerHTML = `
      <div class="sabbat-glyph-big">${s.glyph}</div>
      <div class="sabbat-date">${s.date}</div>
      <div class="sabbat-name">${s.name}</div>
      <div class="sabbat-subtitle">${s.subtitle}</div>
    `;
    card.appendChild(head);

    const tabRow = document.createElement('div');
    tabRow.className = 'tabs';
    TABS.forEach((t,i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i===0 ? ' active':'');
      btn.textContent = t.label;
      btn.dataset.tab = t.key;
      btn.addEventListener('click', () => {
        card.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        card.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        card.querySelector(`.tab-panel[data-tab="${t.key}"]`).classList.add('active');
      });
      tabRow.appendChild(btn);
    });
    card.appendChild(tabRow);

    const meaningPanel = document.createElement('div');
    meaningPanel.className = 'tab-panel active';
    meaningPanel.dataset.tab = 'meaning';
    meaningPanel.innerHTML = `<p>${s.meaning}</p>`;
    card.appendChild(meaningPanel);

    const ritualPanel = document.createElement('div');
    ritualPanel.className = 'tab-panel';
    ritualPanel.dataset.tab = 'ritual';
    ritualPanel.innerHTML = `<p>${s.ritual}</p>`;
    card.appendChild(ritualPanel);

    const chartPanel = document.createElement('div');
    chartPanel.className = 'tab-panel';
    chartPanel.dataset.tab = 'chartResonance';
    chartPanel.innerHTML = `<p>${s.chartResonance}</p>`;
    card.appendChild(chartPanel);

    const corrPanel = document.createElement('div');
    corrPanel.className = 'tab-panel';
    corrPanel.dataset.tab = 'correspondences';
    let corrHTML = '<div class="corr-grid">';
    for(const [label, value] of Object.entries(s.correspondences)){
      corrHTML += `<div class="corr-item"><div class="corr-label">${label}</div><div class="corr-value">${value}</div></div>`;
    }
    corrHTML += '</div>';
    corrPanel.innerHTML = corrHTML;
    card.appendChild(corrPanel);

    const culturePanel = document.createElement('div');
    culturePanel.className = 'tab-panel';
    culturePanel.dataset.tab = 'culture';
    let cultureHTML = '<div class="culture-grid">';
    s.culture.forEach(c => {
      cultureHTML += `<div class="culture-item"><div class="c-name">${c.name}</div><div>${c.text}</div></div>`;
    });
    cultureHTML += '</div>';
    culturePanel.innerHTML = cultureHTML;
    card.appendChild(culturePanel);

    container.appendChild(card);
  });
}

function selectSabbat(id, scroll){
  document.querySelectorAll('.sabbat-chip').forEach(c => c.classList.remove('active-chip'));
  const chip = document.getElementById('chip-' + id);
  if(chip) chip.classList.add('active-chip');
  if(scroll){
    const card = document.getElementById(id);
    if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

renderWheel();
renderMarker();
renderStrip();
renderCards();
</script>
